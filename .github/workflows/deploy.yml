name: Deploy TMX Mercury

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
  TMX_PATH: tmx-mercury
  TMX_NAME: "TMX Mercury"
  PROJECT_NAME: tmx-mercury
  PROJECT_VERSION: ${{ github.ref_name }}
  PORT: 3000
  NODE_ENV: production

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --include=dev
      env:
        NODE_ENV: development
      
    - name: Run prefetch command
      run: npm run prefetch
      
    - name: Run prelint command
      run: npm run prelint
      
    - name: Run init command
      run: npm run prestart
      
    - name: Run tests
      run: npm run test
      env:
        NODE_ENV: development
      
    - name: Run linting
      run: npm run lint
      env:
        NODE_ENV: development

  prepare-release:
    needs: test
    runs-on: ubuntu-latest
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'chore(release)')
    env:
      HUSKY: '0'
      HUSKY_SKIP_HOOKS: '1'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --include=dev
      env:
        NODE_ENV: development

    - name: Run prefetch command
      run: npm run prefetch

    - name: Run prelint command
      run: npm run prelint

    - name: Run init command
      run: npm run prestart

    - name: Configure git identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create release branch
      run: git checkout -b release/next

    - name: Run release command (version bump + changelog)
      run: npm run release
      env:
        NODE_ENV: development

    - name: Push release branch
      run: git push origin release/next --force

    - name: Read new version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Create or update release pull request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh pr view release/next --json number >/dev/null 2>&1; then
          echo "PR de release já existe, branch atualizada."
        else
          gh pr create \
            --title "chore(release): v${{ steps.version.outputs.version }}" \
            --body "PR automática gerada por 'npm run release'. Ao ser mergeada, publica a versão v${{ steps.version.outputs.version }}." \
            --base main \
            --head release/next
        fi

    - name: Enable auto-merge on release PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh pr merge release/next --auto --squash
      continue-on-error: true

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci --include=dev
      env:
        NODE_ENV: development
      
    - name: Run prefetch command
      run: npm run prefetch
      
    - name: Run prelint command
      run: npm run prelint
      
    - name: Run init command
      run: npm run prestart

    - name: Read current version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Build application
      run: npm run build
      env:
        NODE_ENV: production
        PORT: 3000
      
    - name: Upload Pages build artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build

    - name: Set up QEMU emulation (for cross-platform builds)
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Validate Docker Hub secrets
      if: github.event_name != 'pull_request'
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo 'ERROR: Docker Hub secrets DOCKER_USERNAME and DOCKER_PASSWORD must be configured in repository settings.'
          exit 1
        fi

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value=v${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          TMX_PATH=${{ env.TMX_PATH }}
          TMX_NAME=${{ env.TMX_NAME }}
          PROJECT_NAME=${{ env.PROJECT_NAME }}
          PROJECT_VERSION=${{ steps.version.outputs.version }}
          NODE_ENV=${{ env.NODE_ENV }}
          PORT=${{ env.PORT }}

    - name: Tag release commit
      if: contains(github.event.head_commit.message, 'chore(release)')
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag "v${{ steps.version.outputs.version }}"
        git push origin "v${{ steps.version.outputs.version }}"

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}